apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: databases.mycompany.com

spec:
  group: mycompany.com
  scope: Namespaced

  names:
    kind: Database
    plural: databases
    singular: database
    shortNames:
      - db

  versions:
    - name: v1
      served: true
      storage: true

      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:

                engine:
                  type: string

                version:
                  type: string

                replicas:
                  type: integer

                backup:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    schedule:
                      type: string
                    retentionDays:
                      type: integer