apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: stage-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/PiyushThaware07/learning-2026
    targetRevision: argocd
    path: multicluster

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true