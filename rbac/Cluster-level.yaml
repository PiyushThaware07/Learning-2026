# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: dev-ns # Namespace name

---

# ServiceAccount --> Identity used by Pods to communicate with Kubernetes API
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-service-account # ServiceAccount name
  namespace: dev-ns # Namespace where ServiceAccount exists

---

# ClusterRole --> Defines cluster-wide permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-reader-cluster-role # ClusterRole name

rules:
  - apiGroups: [""] # Core Kubernetes API group
    resources: ["pods"] # Resource type
    verbs: ["get", "list"] # Allowed actions

---

# ClusterRoleBinding --> Grants ClusterRole permissions cluster-wide
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-reader-cluster-binding # ClusterRoleBinding name

subjects:
  - kind: ServiceAccount # Subject type
    name: dev-service-account # ServiceAccount name
    namespace: dev-ns # Namespace of ServiceAccount

roleRef:
  kind: ClusterRole # Refers to a ClusterRole
  name: pod-reader-cluster-role # ClusterRole being assigned
  apiGroup: rbac.authorization.k8s.io # RBAC API group