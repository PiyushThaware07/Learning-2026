# Playbook to display secret values
- name: Show Secrets
  hosts: servers
  become: yes

  # Load variables from external YAML file
  vars_files:
    - secrets.yaml

  tasks:

    # Display the username variable
    - name: Show Username
      debug:
        msg: "My username is {{ username }}"

    # Display the password variable
    # no_log hides sensitive data from terminal output
    - name: Show Password
      debug:
        msg: "My password is {{ password }}"
      no_log: true

    # Display the API key variable
    - name: Show Api Key
      debug:
        msg: "My API Key is {{ api_key }}"