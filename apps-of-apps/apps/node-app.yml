apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: node-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/PiyushThaware07/learning-2026
    targetRevision: argocd
    path: app-of-app/apps/node

  destination:
    server: https://172.31.7.77:33893
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true