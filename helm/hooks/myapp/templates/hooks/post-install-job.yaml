apiVersion: batch/v1
kind: Job
metadata:
  name: '{{ include "myapp.fullname" . }}-post-install'
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: post-install
          image: busybox
          command:
            - sh
            - -c
            - 'echo "Post-install hook executed successfully"'