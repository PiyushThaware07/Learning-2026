apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: nginx-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/PiyushThaware07/learning-2026
    targetRevision: argocd
    path: demo_apps/nginx

  destination:
    server: https://172.31.37.194:33893 
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true