# Create Namespace
# Namespace is used to logically separate Kubernetes resources
apiVersion: v1
kind: Namespace

metadata:
  name: dev-ns                      # Namespace name

---

# Create PersistentVolumeClaim
# PVC is used to request/claim storage from PV

apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: my-pvc                      # PVC name
  namespace: dev-ns                 # PVC belongs to this namespace

spec:
  accessModes:
    - ReadWriteOnce                 # Must match PV access mode

  resources:
    requests:
      storage: 1Gi                  # Requested storage size


---

# Create Pod
# Pod uses PVC to access persistent storage

apiVersion: v1
kind: Pod

metadata:
  name: nginx-pod                   # Pod name
  namespace: dev-ns                 # Pod namespace

spec:
  containers:
  - name: nginx-container           # Container name
    image: nginx:latest             # Nginx image

    ports:
    - containerPort: 80             # Expose container port

    volumeMounts:
    - name: my-volume               # Volume name inside container
      mountPath: /usr/share/nginx/html   # Mount storage path

  volumes:
  - name: my-volume                 # Volume definition

    persistentVolumeClaim:
      claimName: my-pvc             # Attach PVC to Pod