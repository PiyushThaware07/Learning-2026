apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app-deployment
  namespace: node-app-ns

spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-app-pod
  template:
    metadata:
      labels:
        app: node-app-pod
    spec:
      containers:
        - name: node-app-container
          image: piyushthaware07/node-app:v1
          ports:
            - containerPort: 80
          env:
            - name: PORT
              value: "3001"