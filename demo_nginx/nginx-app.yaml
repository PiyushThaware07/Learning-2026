# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: dev-ns

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: dev-ns

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx-pod

  template:
    metadata:
      labels:
        app: nginx-pod

    spec:
      containers:
        - name: nginx-container
          image: nginx:latest
          ports:
            - containerPort: 80

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: dev-ns

spec:
  selector:
    app: nginx-pod

  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

  type: ClusterIP