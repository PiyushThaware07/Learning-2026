# Create Namespace
apiVersion: v1
kind: Namespace

metadata:
  name: dev-ns                  # Namespace name

---

# Create ReplicaSet
apiVersion: apps/v1             # API version for ReplicaSet resource
kind: ReplicaSet                # Defines this resource as a ReplicaSet

metadata:
  name: my-replicasets          # Name of the ReplicaSet
  namespace: dev-ns             # Namespace where ReplicaSet will run

spec:
  replicas: 4                   # Desired number of Pod replicas

  selector:
    matchLabels:
      app: nginx-pod            # ReplicaSet manages Pods with this label

  template:                     # Blueprint for creating Pods
    metadata:
      labels:
        app: nginx-pod          # Label assigned to Pods (must match selector)

    spec:
      containers:
      - name: nginx-container   # Name of the container inside the Pod
        image: nginx:latest     # Docker image to run

        ports:
        - containerPort: 80     # Port exposed by the container